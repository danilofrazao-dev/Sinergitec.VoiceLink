<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classic Black & White Flip Clock</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Oswald:wght@600&family=JetBrains+Mono:wght@700&family=Inter:wght@700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0d0d0d;
      --card-bg: #1a1a1a;
      --card-top-bg: #222222;
      --card-bottom-bg: #161616;
      --text-color: #f0f0f0;
      --border-color: #111111;
      --line-color: rgba(0, 0, 0, 0.6);
      --font-family: 'Oswald', sans-serif;
      --clock-scale: 1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: var(--font-family);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Flip Clock Container */
    .clock-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(10px, 2vw, 30px);
      padding: 20px;
      transform: scale(var(--clock-scale));
      transition: transform 0.3s ease;
    }

    .group-wrapper {
      display: flex;
      align-items: center;
      gap: clamp(4px, 1vw, 12px);
    }

    .label-tag {
      position: absolute;
      bottom: -28px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      letter-spacing: 2px;
      color: #666;
      text-transform: uppercase;
    }

    .unit-container {
      position: relative;
      display: flex;
      gap: clamp(4px, 1vw, 10px);
    }

    /* Flip Card */
    .flip-card {
      position: relative;
      width: clamp(90px, 17vw, 240px);
      height: clamp(130px, 25vw, 360px);
      font-size: clamp(105px, 21vw, 300px);
      line-height: clamp(130px, 25vw, 360px);
      text-align: center;
      border-radius: 12px;
      background: var(--card-bg);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.9),
                  0 0 0 1px rgba(255, 255, 255, 0.05) inset;
      perspective: 1000px;
    }

    .flip-card .top,
    .flip-card .bottom,
    .flip-card .leaf-top,
    .flip-card .leaf-bottom {
      position: absolute;
      left: 0;
      right: 0;
      overflow: hidden;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .flip-card .top,
    .flip-card .leaf-top {
      top: 0;
      height: 50%;
      background: var(--card-top-bg);
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
      border-bottom: 1px solid var(--line-color);
    }

    .flip-card .bottom,
    .flip-card .leaf-bottom {
      bottom: 0;
      height: 50%;
      background: var(--card-bottom-bg);
      border-bottom-left-radius: 12px;
      border-bottom-right-radius: 12px;
    }

    /* Inner text positioning inside split halves */
    .flip-card .number {
      position: absolute;
      width: 100%;
      height: 200%;
      left: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      color: var(--text-color);
      font-weight: bold;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    .flip-card .top .number,
    .flip-card .leaf-top .number {
      top: 0;
    }

    .flip-card .bottom .number,
    .flip-card .leaf-bottom .number {
      bottom: 0;
    }

    /* Horizontal slit divider */
    .flip-card::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 2px;
      background: rgba(0, 0, 0, 0.75);
      box-shadow: 0 1px 1px rgba(255, 255, 255, 0.1);
      z-index: 10;
      transform: translateY(-50%);
    }

    /* Side notches */
    .flip-card::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      width: 100%;
      height: 0;
      z-index: 11;
    }

    .flip-card-notch-left, .flip-card-notch-right {
      position: absolute;
      top: calc(50% - 6px);
      width: 8px;
      height: 12px;
      background: var(--bg-color);
      z-index: 12;
    }
    .flip-card-notch-left { left: -1px; border-top-right-radius: 6px; border-bottom-right-radius: 6px; }
    .flip-card-notch-right { right: -1px; border-top-left-radius: 6px; border-bottom-left-radius: 6px; }

    /* Flip Animations */
    .flip-card .leaf-top {
      transform-origin: 50% 100%;
      animation: flip-top 0.35s ease-in forwards;
      z-index: 3;
    }

    .flip-card .leaf-bottom {
      transform-origin: 50% 0%;
      animation: flip-bottom 0.35s 0.35s ease-out forwards;
      z-index: 2;
    }

    @keyframes flip-top {
      0% { transform: rotateX(0deg); filter: brightness(1); }
      100% { transform: rotateX(-90deg); filter: brightness(0.4); }
    }

    @keyframes flip-bottom {
      0% { transform: rotateX(90deg); filter: brightness(0.4); }
      100% { transform: rotateX(0deg); filter: brightness(1); }
    }

    /* Separator dots / Colon */
    .colon-separator {
      display: flex;
      flex-direction: column;
      gap: 16px;
      justify-content: center;
      align-items: center;
      padding: 0 4px;
    }
    .dot {
      width: clamp(8px, 1.5vw, 18px);
      height: clamp(8px, 1.5vw, 18px);
      background: rgba(240, 240, 240, 0.8);
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    }

    /* AM/PM Indicator */
    .ampm-card {
      font-family: 'Inter', sans-serif;
      font-size: clamp(14px, 2.5vw, 28px);
      font-weight: 700;
      letter-spacing: 2px;
      color: #aaa;
      padding: 8px 14px;
      background: #181818;
      border: 1px solid #2a2a2a;
      border-radius: 8px;
      align-self: flex-end;
      margin-bottom: 12px;
    }

    /* Date Header / Subtitle */
    .date-display {
      position: absolute;
      top: 25px;
      font-family: 'Inter', sans-serif;
      font-size: clamp(11px, 1.3vw, 18px);
      letter-spacing: 4px;
      color: #888;
      text-transform: uppercase;
      font-weight: 500;
    }

    /* Options Overlay Controls */
    .toolbar {
      position: absolute;
      bottom: 30px;
      display: flex;
      gap: 12px;
      background: rgba(20, 20, 20, 0.85);
      backdrop-filter: blur(10px);
      padding: 10px 20px;
      border-radius: 50px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      transition: opacity 0.4s ease, transform 0.4s ease;
      z-index: 100;
    }

    .toolbar.hidden {
      opacity: 0;
      transform: translateY(20px);
      pointer-events: none;
    }

    .btn {
      background: #252525;
      color: #ddd;
      border: 1px solid #3d3d3d;
      padding: 8px 14px;
      border-radius: 20px;
      font-family: 'Inter', sans-serif;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      background: #353535;
      color: #fff;
      border-color: #555;
    }

    .btn.active {
      background: #ffffff;
      color: #000000;
      font-weight: 700;
      border-color: #ffffff;
    }

    select.btn {
      appearance: none;
      -webkit-appearance: none;
      padding-right: 24px;
      background-image: url('data:image/svg+xml;utf8,<svg fill="white" height="12" viewBox="0 0 24 24" width="12" xmlns="http://www.w3.org/2000/svg"><path d="M7 10l5 5 5-5z"/></svg>');
      background-repeat: no-repeat;
      background-position: right 8px center;
    }

    /* Ambient noise background */
    .bg-noise {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: radial-gradient(circle at 50% 50%, rgba(30, 30, 30, 0.4) 0%, rgba(10, 10, 10, 0.9) 100%);
      pointer-events: none;
      z-index: -1;
    }
  </style>
</head>
<body>

  <div class="bg-noise"></div>

  <div class="date-display" id="date-display">MONDAY, 12 MAY</div>

  <div class="clock-container" id="clock">
    <!-- Hours -->
    <div class="group-wrapper">
      <div class="unit-container">
        <div class="flip-card" id="h1">
          <div class="flip-card-notch-left"></div>
          <div class="flip-card-notch-right"></div>
          <div class="top"><div class="number">0</div></div>
          <div class="bottom"><div class="number">0</div></div>
        </div>
        <div class="flip-card" id="h2">
          <div class="flip-card-notch-left"></div>
          <div class="flip-card-notch-right"></div>
          <div class="top"><div class="number">0</div></div>
          <div class="bottom"><div class="number">0</div></div>
        </div>
      </div>
    </div>

    <div class="colon-separator">
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

    <!-- Minutes -->
    <div class="group-wrapper">
      <div class="unit-container">
        <div class="flip-card" id="m1">
          <div class="flip-card-notch-left"></div>
          <div class="flip-card-notch-right"></div>
          <div class="top"><div class="number">0</div></div>
          <div class="bottom"><div class="number">0</div></div>
        </div>
        <div class="flip-card" id="m2">
          <div class="flip-card-notch-left"></div>
          <div class="flip-card-notch-right"></div>
          <div class="top"><div class="number">0</div></div>
          <div class="bottom"><div class="number">0</div></div>
        </div>
      </div>
    </div>

    <!-- Seconds (Optional) -->
    <div class="colon-separator" id="sec-colon" style="display: none;">
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

    <div class="group-wrapper" id="sec-group" style="display: none;">
      <div class="unit-container">
        <div class="flip-card" id="s1">
          <div class="flip-card-notch-left"></div>
          <div class="flip-card-notch-right"></div>
          <div class="top"><div class="number">0</div></div>
          <div class="bottom"><div class="number">0</div></div>
        </div>
        <div class="flip-card" id="s2">
          <div class="flip-card-notch-left"></div>
          <div class="flip-card-notch-right"></div>
          <div class="top"><div class="number">0</div></div>
          <div class="bottom"><div class="number">0</div></div>
        </div>
      </div>
    </div>

    <!-- AM / PM Indicator -->
    <div class="ampm-card" id="ampm-card" style="display: none;">PM</div>
  </div>

  <!-- Toolbar Controls -->
  <div class="toolbar" id="toolbar">
    <button class="btn active" id="btn-format">24H</button>
    <button class="btn" id="btn-seconds">SEC</button>
    <button class="btn active" id="btn-date">DATE</button>
    
    <select class="btn" id="font-select">
      <option value="'Bebas Neue', sans-serif">Font: Bebas Neue</option>
      <option value="'Oswald', sans-serif" selected>Font: Oswald</option>
      <option value="'JetBrains Mono', monospace">Font: JetBrains Mono</option>
      <option value="'Inter', sans-serif">Font: Inter Bold</option>
    </select>

    <button class="btn" id="btn-fullscreen">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
      </svg>
      FULLSCREEN
    </button>
  </div>

  <script>
    // State
    let is24Hour = true;
    let showSeconds = false;
    let showDate = true;
    let state = { h1: '', h2: '', m1: '', m2: '', s1: '', s2: '' };

    // Elements
    const dateDisplay = document.getElementById('date-display');
    const secColon = document.getElementById('sec-colon');
    const secGroup = document.getElementById('sec-group');
    const ampmCard = document.getElementById('ampm-card');
    const toolbar = document.getElementById('toolbar');

    // Controls
    const btnFormat = document.getElementById('btn-format');
    const btnSeconds = document.getElementById('btn-seconds');
    const btnDate = document.getElementById('btn-date');
    const fontSelect = document.getElementById('font-select');
    const btnFullscreen = document.getElementById('btn-fullscreen');

    function updateFlipCard(id, newValue) {
      const card = document.getElementById(id);
      if (!card) return;

      const topVal = card.querySelector('.top .number').textContent;
      if (topVal === newValue) return;

      // Clean up previous animations
      const oldLeaves = card.querySelectorAll('.leaf-top, .leaf-bottom');
      oldLeaves.forEach(el => el.remove());

      // Create animated leaves
      const leafTop = document.createElement('div');
      leafTop.className = 'leaf-top';
      leafTop.innerHTML = `<div class="number">${topVal}</div>`;

      const leafBottom = document.createElement('div');
      leafBottom.className = 'leaf-bottom';
      leafBottom.innerHTML = `<div class="number">${newValue}</div>`;

      // Update static bottom value immediately under the cover
      card.querySelector('.bottom .number').textContent = newValue;

      card.appendChild(leafTop);
      card.appendChild(leafBottom);

      // When leafTop flips down, update static top value
      setTimeout(() => {
        card.querySelector('.top .number').textContent = newValue;
      }, 350);

      // Clean up DOM after flip completes
      setTimeout(() => {
        leafTop.remove();
        leafBottom.remove();
      }, 700);
    }

    function updateClock() {
      const now = new Date();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      let ampm = '';

      if (!is24Hour) {
        ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12;
        hours = hours ? hours : 12; // 0 becomes 12
      }

      const hoursStr = String(hours).padStart(2, '0');

      // Update digits
      updateFlipCard('h1', hoursStr[0]);
      updateFlipCard('h2', hoursStr[1]);
      updateFlipCard('m1', minutes[0]);
      updateFlipCard('m2', minutes[1]);

      if (showSeconds) {
        updateFlipCard('s1', seconds[0]);
        updateFlipCard('s2', seconds[1]);
      }

      if (!is24Hour) {
        ampmCard.textContent = ampm;
      }

      // Update Date
      if (showDate) {
        const options = { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' };
        dateDisplay.textContent = now.toLocaleDateString('en-US', options).toUpperCase();
      }
    }

    // Toggle Handlers
    btnFormat.addEventListener('click', () => {
      is24Hour = !is24Hour;
      btnFormat.textContent = is24Hour ? '24H' : '12H';
      ampmCard.style.display = is24Hour ? 'none' : 'block';
      updateClock();
    });

    btnSeconds.addEventListener('click', () => {
      showSeconds = !showSeconds;
      btnSeconds.classList.toggle('active', showSeconds);
      secColon.style.display = showSeconds ? 'flex' : 'none';
      secGroup.style.display = showSeconds ? 'flex' : 'none';
    });

    btnDate.addEventListener('click', () => {
      showDate = !showDate;
      btnDate.classList.toggle('active', showDate);
      dateDisplay.style.display = showDate ? 'block' : 'none';
    });

    fontSelect.addEventListener('change', (e) => {
      document.documentElement.style.setProperty('--font-family', e.target.value);
    });

    btnFullscreen.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {});
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    });

    // Auto-hide toolbar on inactivity
    let idleTimer;
    function resetIdleTimer() {
      toolbar.classList.remove('hidden');
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => {
        toolbar.classList.add('hidden');
      }, 4000);
    }
    window.addEventListener('mousemove', resetIdleTimer);
    window.addEventListener('click', resetIdleTimer);
    window.addEventListener('keydown', resetIdleTimer);
    resetIdleTimer();

    // Initial setup & tick loop
    setInterval(updateClock, 1000);
    updateClock();
  </script>
</body>
</html>
